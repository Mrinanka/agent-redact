name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # The release workflow runs the whole of CI on a tag before it makes a draft release.
  workflow_call:

permissions:
  contents: read

# A push to a branch with an open PR triggers both events; keep only the newest run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Step 2 "Done when": the generated rules are current, and the numbers print.
      - run: npm run rules:build -- --check
      # Step 3: the plugin's copy of the sources is current.
      - run: npm run plugin:build -- --check
      - run: npm run measure

  # Step 1 "Done when": against the empty tool, every planted fake is reported leaked.
  leak-test:
    name: leak test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the pinned Claude Code
        run: npm ci --ignore-scripts --prefix tools/leak-test/claude-pin
      - name: Leak test baseline
        run: npm run leak-test:baseline -- --require-pinned
      - name: Put the pinned Claude Code on PATH
        shell: bash
        run: node tools/leak-test/claude-path.ts >> "$GITHUB_PATH"
      # Step 3 "Done when": with the tool loaded, no planted fake reaches the model.
      - name: Validate the plugin
        run: claude plugin validate ./plugin
      - name: Plugin tests
        run: claude plugin test ./plugin
      - name: Leak test, core hiding
        run: npm run leak-test:core -- --require-pinned
      # Step 4 "Done when": every door, a stopped resume and a registered value included.
      - name: Leak test, every door
        if: runner.os != 'Linux'
        run: npm run leak-test -- --require-pinned --allow-real-store
      # Step 5 "Done when": the backup lock, run as settings hooks with the plugin not loaded. Inside its limits no
      # fake may be seen; outside them every fake must be seen, so the list of limits is proven, not claimed.
      - name: Leak test, backup lock
        run: npm run leak-test:backup -- --require-pinned
      - name: Leak test, backup lock limits
        run: npm run leak-test:backup-limits -- --require-pinned
      # The managed run writes the machine's managed settings file for about a minute and removes it after.
      # Windows runners are administrators; macOS and Linux write through sudo -n (no password).
      - name: Leak test, backup lock as managed hooks in safe mode
        run: npm run leak-test:managed -- --require-pinned
      # Step 6: the organization install (a folder marketplace, the plugin in prependPlugins) must hide every door, and the
      # debug log must show the plugin in tier prepend. Then the same machine with the plugin as a user plugin: the
      # built-in guard passes some doors over, and those must leak (spec §22), so the limit is measured, not claimed.
      - name: Leak test, organization install
        run: npm run leak-test:org -- --require-pinned
      - name: Leak test, user plugin under the built-in guard
        run: npm run leak-test:guarded -- --require-pinned --report guarded-report.json
      - name: Show the guarded runs (counts and labels only)
        if: always()
        shell: bash
        run: |
          test -f guarded-report.json && node -e "const r=JSON.parse(require('fs').readFileSync('guarded-report.json','utf8'));for(const x of r.runs)console.log(x.scenario,'run',x.run,'exit',x.exit,'timedOut',x.timedOut,'requests',x.requests,'seconds',x.seconds,JSON.stringify(x.stderr??[]))" || true
      # The plugin reads the policy source from a real managed file, and doctor calls the install Managed.
      - name: Doctor and policy, real managed file
        env:
          AEGISCONTEXT_MANAGED_REAL: '1'
        run: node --test tests/doctor-managed-real.test.ts
      # D-036: what one store item holds and how long reading many takes. Sizes and times only.
      - name: Password store limits
        run: npm run measure:store
      # Checks 0.4 and 0.13, finished here (D-020). The output holds labels and sizes only.
      - name: Password store and Node checks
        run: node experiments/step0-mock/run.ts runtime store
      - name: Linux password store, with and without a keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring
          node experiments/step0-mock/run.ts store
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; node experiments/step0-mock/run.ts store'
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; npm run measure:store; node --test tests/store-real.test.ts'
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; node --test tests/uninstall-real.test.ts'
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; STORE_LOCK_TEST=1 node --test tests/store-locked-real.test.ts'
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; npm run leak-test -- --require-pinned --allow-real-store'
      # Spec §19: the documented uninstall command really removes saved values (Linux runs it above, in a keyring).
      - name: Uninstall removes the saved values
        if: runner.os != 'Linux'
        run: node --test tests/uninstall-real.test.ts
      # A really locked store (Known issues): a list must warn, never read as "no list".
      - name: macOS locked Keychain
        if: runner.os == 'macOS'
        run: STORE_LOCK_TEST=1 node --test tests/store-locked-real.test.ts
      # The proxy trap only sees traffic that honours proxy settings. Here nothing can
      # leave: the namespace has only loopback, and the first line proves it.
      - name: Linux baseline with no network
        if: runner.os == 'Linux'
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" "RUN_AS=$(id -un)" unshare --net -- sh -c '
            ip link set lo up &&
            node -e "require(\"node:net\").connect(443, \"1.1.1.1\").on(\"connect\", () => process.exit(1)).on(\"error\", () => process.exit(0))" &&
            exec sudo -u "$RUN_AS" env "PATH=$PATH" "HOME=$HOME" npm run leak-test:baseline -- --require-pinned'

  # The backup lock runs under whatever `node` is on the person's PATH, and doctor's floor is Node 20 (a guess until
  # this ran). The kit itself needs Node 24, so it is started by its absolute path while an older Node leads the PATH.
  backup-node:
    name: backup lock on Node ${{ matrix.node }} (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the pinned Claude Code
        run: npm ci --ignore-scripts --prefix tools/leak-test/claude-pin
      - name: Remember the Node that runs the kit
        shell: bash
        run: echo "KIT_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Show which Node the hooks will find
        shell: bash
        run: node --version
      - name: Leak test, backup lock under this Node
        shell: bash
        run: '"$KIT_NODE" tools/leak-test/run.ts --no-plugin --backup user --require-pinned'
