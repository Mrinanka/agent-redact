name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A push to a branch with an open PR triggers both events; keep only the newest run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      # Step 2 "Done when": the generated rules are current, and the numbers print.
      - run: npm run rules:build -- --check
      # Step 3: the plugin's copy of the sources is current.
      - run: npm run plugin:build -- --check
      - run: npm run measure

  # Step 1 "Done when": against the empty tool, every planted fake is reported leaked.
  leak-test:
    name: leak test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the pinned Claude Code
        run: npm ci --ignore-scripts --prefix tools/leak-test/claude-pin
      - name: Leak test baseline
        run: npm run leak-test:baseline -- --require-pinned
      - name: Put the pinned Claude Code on PATH
        shell: bash
        run: node tools/leak-test/claude-path.ts >> "$GITHUB_PATH"
      # Step 3 "Done when": with the tool loaded, no planted fake reaches the model.
      - name: Validate the plugin
        run: claude plugin validate ./plugin
      - name: Plugin tests
        run: claude plugin test ./plugin
      - name: Leak test, core hiding
        run: npm run leak-test:core -- --require-pinned
      # D-036: what one store item holds and how long reading many takes. Sizes and times only.
      - name: Password store limits
        run: npm run measure:store
      # Checks 0.4 and 0.13, finished here (D-020). The output holds labels and sizes only.
      - name: Password store and Node checks
        run: node experiments/step0-mock/run.ts runtime store
      - name: Linux password store, with and without a keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-tools gnome-keyring
          node experiments/step0-mock/run.ts store
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; node experiments/step0-mock/run.ts store'
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null; npm run measure:store; node --test tests/store-real.test.ts'
      # The proxy trap only sees traffic that honours proxy settings. Here nothing can
      # leave: the namespace has only loopback, and the first line proves it.
      - name: Linux baseline with no network
        if: runner.os == 'Linux'
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" "RUN_AS=$(id -un)" unshare --net -- sh -c '
            ip link set lo up &&
            node -e "require(\"node:net\").connect(443, \"1.1.1.1\").on(\"connect\", () => process.exit(1)).on(\"error\", () => process.exit(0))" &&
            exec sudo -u "$RUN_AS" env "PATH=$PATH" "HOME=$HOME" npm run leak-test:baseline -- --require-pinned'
